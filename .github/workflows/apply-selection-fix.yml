name: Apply and verify selection fix

on:
  push:
    branches:
      - agent/preserve-service-selection

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.head_commit.message == 'chore: run selection fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preserve-service-selection
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply patch
        run: |
          git apply --check .github/selection-fix.patch
          git apply .github/selection-fix.patch
      - name: Format
        run: gofmt -w internal/ui/model.go internal/ui/model_test.go
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/ui/model.go internal/ui/model_test.go
          git commit -m 'fix: preserve selected service across list rebuilds'
          git push origin HEAD:agent/preserve-service-selection
