name: Apply and verify selection fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: selection-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preserve-service-selection
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply patch
        run: |
          sed -i 's/^ diff --git/diff --git/' .github/selection-fix.patch
          if git apply --check .github/selection-fix.patch; then
            git apply .github/selection-fix.patch
          elif git apply --reverse --check .github/selection-fix.patch; then
            echo 'Patch is already applied'
          else
            echo 'Patch cannot be applied cleanly'
            exit 1
          fi
      - name: Format
        run: gofmt -w internal/ui/model.go internal/ui/model_test.go
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/ui/model.go internal/ui/model_test.go
          if git diff --cached --quiet; then
            echo 'Verified code is already committed'
            exit 0
          fi
          git commit -m 'fix: preserve selected service across list rebuilds'
          git push origin HEAD:agent/preserve-service-selection
