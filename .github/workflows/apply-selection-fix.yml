name: Apply and verify selection fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: selection-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preserve-service-selection
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply deterministic transformation
        run: |
          python3 .github/apply_selection_fix.py
          python3 .github/apply_selection_followup.py
      - name: Format
        run: gofmt -w internal/ui/model.go internal/ui/model_test.go
      - name: Vet
        run: go vet ./...
      - name: Test
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee selection-test-output.txt
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selection-test-output
          path: selection-test-output.txt
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/ui/model.go internal/ui/model_test.go
          if git diff --cached --quiet; then
            echo 'Verified code is already committed'
            exit 0
          fi
          git commit -m 'fix: preserve selected service across list rebuilds'
          git push origin HEAD:agent/preserve-service-selection
