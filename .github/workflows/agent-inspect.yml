name: Agent verify reliability fixes

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/fix-service-discovery-follow-refresh-layout

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-service-discovery-follow-refresh-layout
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply deterministic source transformation
        run: python3 .github/agent_apply_reliability.py
      - name: Format changed Go files
        run: |
          gofmt -w \
            internal/client/types.go \
            internal/service/client.go \
            internal/service/client_test.go \
            internal/service/reliability_test.go \
            internal/ui/commands.go \
            internal/ui/model.go \
            internal/ui/model_test.go \
            internal/ui/reliability_test.go
      - name: Vet complete module
        shell: bash
        run: |
          set -o pipefail
          go vet ./... 2>&1 | tee .agent-verification.txt
      - name: Run complete test suite
        run: go test ./... -count=1
      - name: Stress reliability packages
        run: go test ./internal/service ./internal/ui -count=20
      - name: Run race detector
        run: go test -race ./... -count=1
      - name: Commit verification diagnostics
        if: failure() && github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agent-verification.txt
          git commit -m 'chore: capture temporary verification failure'
          git push origin HEAD:agent/fix-service-discovery-follow-refresh-layout
      - name: Commit verified implementation
        if: success() && github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            internal/client/types.go \
            internal/service/client.go \
            internal/service/client_test.go \
            internal/service/reliability_test.go \
            internal/ui/commands.go \
            internal/ui/model.go \
            internal/ui/model_test.go \
            internal/ui/reliability_test.go
          if ! git diff --cached --quiet; then
            git commit -m 'fix: harden service discovery and async reliability'
            git push origin HEAD:agent/fix-service-discovery-follow-refresh-layout
          fi
