name: Agent verify PR 4

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/classify-service-state-errors

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check changed-file formatting
        run: test -z "$(gofmt -l internal/client/errors.go internal/client/errors_test.go)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
